version: "3.9"

# 1.0 编排示例：
#   - master：用户面，对外暴露 8080
#   - worker-cn：国内，承载豆包/DeepSeek/Kimi
#   - worker-us：美国，承载 OpenAI/Claude
#
# master 与 worker 之间用内部网络（backend 桥接）通信。
# 真实部署时 worker-us 应部署在美西 VPS，worker-cn 在国内。

services:
  master:
    build: .
    image: aiio:latest
    container_name: aiio-master
    environment:
      AIIO_ROLE: master
      AIIO_CONFIG: /configs/master.yaml
    ports:
      - "8080:8080"
    volumes:
      - ./configs:/configs:ro
      - master-data:/data
    networks: [backend]
    restart: unless-stopped

  worker-cn:
    image: aiio:latest
    container_name: aiio-worker-cn
    environment:
      AIIO_ROLE: worker
      AIIO_REGION: cn
      AIIO_CONFIG: /configs/worker-cn.yaml
    volumes:
      - ./configs:/configs:ro
    networks: [backend]
    restart: unless-stopped
    # 国内 Worker 也可放用户本机或国内云

  worker-us:
    image: aiio:latest
    container_name: aiio-worker-us
    environment:
      AIIO_ROLE: worker
      AIIO_REGION: us-west
      AIIO_CONFIG: /configs/worker-us.yaml
    volumes:
      - ./configs:/configs:ro
    networks: [backend]
    restart: unless-stopped
    # 实际部署：把这一段迁到美西 VPS，删 networks 用公网通信
    # deploy:
    #   replicas: 1
    #   placement:
    #     constraints: [node.labels.region==us-west]

networks:
  backend:
    driver: bridge

volumes:
  master-data:
