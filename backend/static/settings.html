<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#4f46e5" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🤖</text></svg>" />
  <title>设置</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="topbar" role="banner">
    <a href="home.html" class="logo">AI 助手</a>
    <div class="topbar-right">
      <select id="theme-switch" aria-label="主题切换">
        <option value="auto">🌓</option>
        <option value="light">☀️</option>
        <option value="dark">🌙</option>
      </select>
      <select id="lang-switch" aria-label="语言切换">
        <option value="zh">中文</option>
        <option value="en">English</option>
      </select>
      <a href="settings.html" data-i18n="app.settings">设置</a>
    </div>
  </header>

  <main class="container" role="main">
    <h1 data-i18n="settings.title">设置</h1>

    <section class="card" aria-labelledby="keys-heading">
      <h2 id="keys-heading" data-i18n="settings.apiKeys">我的 API Key</h2>
      <div id="provider-keys" role="list"></div>
    </section>

    <section class="card" aria-labelledby="role-heading">
      <h2 id="role-heading" data-i18n="settings.systemPrompt">AI 角色</h2>
      <label for="system-prompt" class="visually-hidden">系统提示词</label>
      <textarea id="system-prompt" rows="4" data-i18n-placeholder="settings.systemPromptPlaceholder"
        placeholder="例：你是一个 X 领域的资深工程师..."
        aria-label="AI 角色系统提示词"></textarea>
      <div class="input-actions">
        <button id="save-system-prompt" class="btn-primary" data-i18n="settings.save" aria-label="保存系统提示词">保存</button>
      </div>
    </section>

    <section class="card" aria-labelledby="advanced-heading">
      <h2 id="advanced-heading" data-i18n="settings.advanced">高级参数</h2>
      <div class="form-row">
        <label for="temperature" data-i18n="settings.temperature">温度</label>
        <input type="range" id="temperature" min="0" max="2" step="0.1" value="1" aria-label="温度" />
        <span id="temperature-val" aria-live="polite">1.0</span>
      </div>
      <div class="form-row">
        <label for="max-tokens" data-i18n="settings.maxTokens">最大长度</label>
        <input type="number" id="max-tokens" value="2000" min="100" max="32000" aria-label="最大长度" />
      </div>
    </section>
  </main>

  <div id="toast" class="toast" role="status" aria-live="polite" style="display:none"></div>

  <script src="i18n.v4.js"></script>
  <script src="app.v4.js"></script>
  <script src="settings.v4.js"></script>
</body>
</html>
