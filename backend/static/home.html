<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#4f46e5" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🤖</text></svg>" />
  <title>AI 助手</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="topbar" role="banner">
    <a href="home.html" class="logo">AI 助手</a>
    <div class="topbar-right">
      <select id="theme-switch" aria-label="主题切换">
        <option value="auto">🌓</option>
        <option value="light">☀️</option>
        <option value="dark">🌙</option>
      </select>
      <select id="lang-switch" aria-label="语言切换">
        <option value="zh">中文</option>
        <option value="en">English</option>
      </select>
      <a href="settings.html" data-i18n="app.settings">设置</a>
    </div>
  </header>

  <main class="chat-page" role="main">
    <!-- Phase 1.2：会话上下文 -->
    <div class="chat-conv-bar" role="region" aria-label="当前会话">
      <span id="conv-title" class="conv-title">新对话</span>
      <span id="conv-id-label" class="conv-id-label"></span>
      <a href="history.html" class="btn-secondary" style="margin-left:auto" data-i18n="nav.history">历史</a>
      <button id="conv-new-btn" class="btn-secondary" data-i18n="nav.newConv">新建</button>
    </div>
    <div class="chat-toolbar" role="toolbar" aria-label="聊天控制">
      <label for="model-select" class="visually-hidden">模型</label>
      <select id="model-select" aria-label="选择模型"></select>
      <label for="mode-select" class="visually-hidden">模式</label>
      <select id="mode-select" aria-label="选择模式">
        <option value="single" data-i18n="mode.single">单个</option>
        <option value="auto" data-i18n="mode.auto">自动选</option>
        <option value="compare" data-i18n="mode.compare">对比</option>
      </select>
    </div>

    <!-- Compare 模式多选（默认隐藏） -->
    <div id="model-multi-wrap" class="model-multi-wrap" role="region" aria-label="选择对比 provider" style="display:none">
      <div class="model-multi-head">
        <span class="model-multi-title" data-i18n="compare.title">选择要对比的 provider（多选）</span>
        <button id="model-multi-all" class="btn-secondary" data-i18n="compare.selectAll">全选已配</button>
      </div>
      <div id="model-multi-list" class="model-multi-list" role="group"></div>
      <div id="model-multi-hint" class="multi-hint multi-hint-warn">请至少选 2 个已配 key 的 provider</div>
    </div>

    <div id="messages" class="messages" role="log" aria-live="polite" aria-label="消息列表"></div>

    <div class="input-area" role="region" aria-label="消息输入">
      <!-- 附件预览：浮在输入框上方 -->
      <div id="attachments-preview" class="attachments-preview" role="region" aria-label="附件预览"></div>

      <!-- 消息输入框 + 附件按钮 + 发送按钮（一行布局） -->
      <div class="composer">
        <input type="file" id="file-input" multiple accept="image/*,.txt,.md,.json,.pdf,.csv,.log" style="display:none" aria-label="选择文件">
        <button id="attach-btn" class="composer-icon" aria-label="添加附件" data-i18n-aria-label="chat.attach" title="附件">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m21.44 11.05-9.19 9.19a6 6 0 0 1-8.49-8.49l9.19-9.19a4 4 0 0 1 5.66 5.66l-9.2 9.19a2 2 0 0 1-2.83-2.83l8.49-8.48"/></svg>
        </button>
        <label for="user-input" class="visually-hidden">输入消息</label>
        <textarea id="user-input" data-i18n-placeholder="chat.placeholder" placeholder="输入消息..."
          aria-label="消息输入" rows="1"></textarea>
        <button id="stop-btn" class="composer-stop" aria-label="停止生成" data-i18n-aria-label="chat.stop" style="display:none">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor"><rect x="6" y="6" width="12" height="12" rx="2"/></svg>
        </button>
        <button id="send-btn" class="composer-send" aria-label="发送消息" data-i18n-aria-label="chat.send">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor"><path d="M2.97 11.34C2.5 11.09 2.5 10.41 2.97 10.16L20.5 2.04C20.91 1.84 21.39 2.16 21.39 2.62L21.39 21.38C21.39 21.84 20.91 22.16 20.5 21.96L2.97 13.86C2.5 13.61 2.5 12.93 2.97 12.68L11.5 12C12.05 11.96 12.05 11.04 11.5 11L2.97 11.34Z"/></svg>
        </button>
      </div>

      <div class="composer-hint">
        <span data-i18n="chat.sendHint">Ctrl/⌘ + Enter 发送</span>
      </div>
    </div>
  </main>

  <div id="toast" class="toast" role="status" aria-live="polite" style="display:none"></div>

  <script src="i18n.v6.js"></script>
  <script src="app.v6.js"></script>
  <script src="home.v6.js"></script>
</body>
</html>
