<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#4f46e5" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🤖</text></svg>" />
  <title>历史对话</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="topbar" role="banner">
    <a href="home.html" class="logo">AI 助手</a>
    <div class="topbar-right">
      <select id="theme-switch" aria-label="主题切换">
        <option value="auto">🌓</option>
        <option value="light">☀️</option>
        <option value="dark">🌙</option>
      </select>
      <select id="lang-switch" aria-label="语言切换">
        <option value="zh">中文</option>
        <option value="en">English</option>
      </select>
      <a href="settings.html" data-i18n="app.settings">设置</a>
    </div>
  </header>

  <main class="container" role="main">
    <h1 data-i18n="history.title">历史对话</h1>
    <p class="muted" data-i18n="history.empty">暂无历史对话</p>
    <div id="conv-list" class="conv-list" role="list"></div>
  </main>

  <div id="toast" class="toast" role="status" aria-live="polite" style="display:none"></div>

  <script src="i18n.v4.js"></script>
  <script src="app.v4.js"></script>
  <script src="history.v4.js"></script>
</body>
</html>
